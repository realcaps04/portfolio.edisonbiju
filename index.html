<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fav_icon.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Edison Biju — web developer. Designing and deploying things." />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Edison Biju | Web Developer</title>
    <script>
      (function () {
        var isAdmin = location.pathname === '/admin' || location.pathname.indexOf('/admin/') === 0;
        if (!isAdmin) return;

        function applyAdminManifest() {
          var links = document.querySelectorAll('link[rel="manifest"]');
          if (links.length) {
            links.forEach(function (link, index) {
              if (index === 0) link.setAttribute('href', '/admin-manifest.webmanifest');
              else link.remove();
            });
          } else {
            var manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = '/admin-manifest.webmanifest';
            document.head.appendChild(manifest);
          }

          document.title = 'EB Admin';

          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (!appleTitle) {
            appleTitle = document.createElement('meta');
            appleTitle.name = 'apple-mobile-web-app-title';
            document.head.appendChild(appleTitle);
          }
          appleTitle.content = 'EB Admin';
        }

        applyAdminManifest();
        document.addEventListener('DOMContentLoaded', applyAdminManifest);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
